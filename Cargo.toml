[package]
name = "nmt-rs"
version = "0.2.5"
edition = "2021"
rust-version = "1.90"
description = "A namespaced merkle tree compatible with Celestia"
license = "MIT OR Apache-2.0"
authors = ["Sovereign Labs <info@sovereign.xyz>"]
homepage = "https://www.sovereign.xyz"
repository = "https://github.com/sovereign-labs/nmt-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sha2 = { version = "0.10.6", default-features = false }
bytes = { version = "1", default-features = false }
serde = { version = "1", default-features = false, optional = true, features = ["derive"] }
borsh = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
borsh = { version = "1", features = ["derive"] }
serde_json = "1.0.96"
postcard = { version = "1.0.4", features = ["use-std"] }
tendermint = { version = "0.41.0" }
criterion = "0.8"

[[bench]]
name = "nmt"
harness = false

[[bench]]
name = "go_parity"
harness = false

[features]
default = ["std"]
borsh = ["dep:borsh"]
serde = [
	"dep:serde",
	"bytes/serde"
]
std = [
	"borsh?/std",
	"serde?/std",
	"bytes/std",
	"sha2/std"
]
