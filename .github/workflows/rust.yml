name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# Cancel superseded runs on a PR; pushes to master get a unique group (run_id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    name: check
    env:
      RUSTFLAGS: -D warnings
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          rustflags: -D warnings
          cache: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run fmt and clippy
        run: make check

  # Check that every combination of features is working properly.
  hack:
    runs-on: ubuntu-latest
    name: features
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: -D warnings
          cache: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # intentionally no target specifier; see https://github.com/jonhoo/rust-ci-conf/pull/4
      - name: cargo hack
        run: cargo hack --feature-powerset check --locked

  # Checks every feature combination on Cargo.toml's rust-version; cargo-hack installs that toolchain itself.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # --lib: dev-dependencies (tendermint, criterion) are not bound by our MSRV.
      - name: cargo hack msrv
        run: cargo hack --rust-version --feature-powerset check --locked --lib

  # Fails on broken intra-doc links and other rustdoc warnings before docs.rs sees them.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - name: cargo doc
        run: cargo doc --no-deps --all-features --locked

  zepter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - name: cargo install zepter
        uses: taiki-e/install-action@v2
        with:
          tool: zepter@1.88.2
      - name: Check feature propagation
        run: zepter run check

  # A target without std, so a dependency that pulls in std fails the build.
  no-std:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: thumbv7em-none-eabi
          rustflags: -D warnings
          cache: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: cargo hack no_std
        run: cargo hack --feature-powerset --exclude-features std,default check --locked --target thumbv7em-none-eabi

  test:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: -D warnings
          cache: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run cargo test
        run: cargo test --locked --all-features

  coverage:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: -D warnings
          components: llvm-tools-preview
          cache: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Upload to codecov.io
        if: ${{ github.repository == 'Sovereign-Labs/nmt-rs' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
