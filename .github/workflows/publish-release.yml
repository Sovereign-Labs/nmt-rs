name: Publish Release

permissions:
  contents: read

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  publish-crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release-plz-')
    # holds CARGO_REGISTRY_TOKEN; required reviewers gate who can publish
    environment: release

    steps:
      - name: Generate release automation token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
